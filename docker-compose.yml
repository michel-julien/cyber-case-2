services:
  app_vuln:
    build:
      context: ./app_vuln
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 5000
    ports:
      - "${VULN_PORT:-8090}:5000"
    networks:
      - school

  app_secure:
    build:
      context: ./app_secure
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 5000
      APP_SECRET_KEY: ${SECURE_APP_SECRET_KEY:-}
      SESSION_COOKIE_SECURE: ${SECURE_SESSION_COOKIE_SECURE:-0}
      LOCAL_DB_HOST: db
      LOCAL_DB_PORT: 5432
      LOCAL_DB_NAME: ${POSTGRES_DB:-cyberlab}
      LOCAL_DB_USER: ${POSTGRES_USER:-cyberlab}
      LOCAL_DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "${SECURE_PORT:-8091}:5000"
    networks:
      - secure_internal
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cyberlab}
      POSTGRES_USER: ${POSTGRES_USER:-cyberlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data_v18:/var/lib/postgresql
    networks:
      - secure_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  attacker:
    build:
      context: ./attacker
    environment:
      SCHOOL_SUBNET: 172.30.0.0/24
      SCHOOL_HTTP_PORT: 5000
    depends_on:
      - app_vuln
    networks:
      - school
    profiles:
      - tools

volumes:
  postgres_data_v18:

networks:
  school:
    name: school
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  secure_internal:
    name: secure-internal
    driver: bridge
